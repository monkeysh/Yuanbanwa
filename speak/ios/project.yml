name: Speak
options:
  bundleIdPrefix: com.yuanbanwa
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: true
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    DEVELOPMENT_TEAM: FQAVS46R89
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    INFOPLIST_KEY_CFBundleDisplayName: 原版娃口语
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    # iPad: also portrait only. Paired with UIRequiresFullScreen=YES below,
    # this satisfies Apple's rule that a Universal app must either support
    # all 4 orientations on iPad (for multitasking) OR declare itself as
    # full-screen-only. Our UI is phone-first — single-hand press-to-talk —
    # so full-screen portrait is the right call.
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UIRequiresFullScreen: "YES"
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
    INFOPLIST_KEY_NSMicrophoneUsageDescription: 需要访问麦克风来录制你的跟读发音，做识别和打分。
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 把你录下的语音转成文字，用来做发音相似度评分。录音处理完全在设备本地进行。
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Speak:
    type: application
    platform: iOS
    sources:
      # Source code (and the JSON resource via `buildPhase: resources`).
      - path: Speak
        excludes:
          - "Resources/audio/**"
      # Bundle audio/ as a folder reference so the subdir structure
      # (audio/bella/, audio/alice/) is preserved at runtime — needed for
      # Bundle.url(forResource:withExtension:subdirectory:) lookups.
      - path: Speak/Resources/audio
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuanbanwa.speak
        PRODUCT_NAME: Speak
