    # Speak pronunciation assessment proxy. This file is included from the
    # speak.yuanbanwa.top server block.
    location = /api/soe {
        limit_req zone=speak_soe_ip burst=5 nodelay;
        limit_req_status 429;
        limit_conn speak_soe_conn 2;
        limit_conn_status 429;

        client_max_body_size 1400k;
        client_body_timeout 10s;
        send_timeout 10s;

        proxy_pass http://127.0.0.1:4006;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 27s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /api/soe/healthz {
        limit_req zone=speak_soe_ip burst=2 nodelay;
        limit_req_status 429;
        limit_conn speak_soe_conn 2;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:4006;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Do not let malformed API paths fall through to the SPA's index.html.
    location ^~ /api/soe/ {
        return 404;
    }
