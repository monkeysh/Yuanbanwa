function hexA(hex, a) {
  if (hex && hex.startsWith('#') && hex.length === 7) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);

// ═══════════════════════════════════════════════════════════════
const SKEY = 'ybw.speak.v2';
const Store = {
  read() { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch { return {}; } },
  write(patch) { const cur = Store.read(); const next = {...cur, ...patch}; localStorage.setItem(SKEY, JSON.stringify(next)); return next; },
  reset() { localStorage.removeItem(SKEY); },
};

// 模拟一次跟读反馈：基于真实形态（ASR 转写 + 逐词比对），原型里随机一两个词标"待清晰"
function mockShadowResult(sentence) {
  const words = sentence.words || sentence.en.replace(/[.?,!]/g,'').split(' ');
  // 随机挑 0–1 个较长的词作为"听不太清/漏读"
  const candidates = words.map((w,i)=>({w,i})).filter(x => x.w.length >= 5);
  const miss = (candidates.length && Math.random() < 0.6) ? candidates[Math.floor(Math.random()*candidates.length)].i : -1;
  const hits = words.map((_,i) => i !== miss);
  const transcript = words.map((w,i)=> i===miss ? '…' : w).join(' ');
  const hitCount = hits.filter(Boolean).length;
  const score = Math.round((hitCount/words.length)*100);
  let comment;
  if (miss === -1) comment = '非常清楚！整句都跟上了，语速也很自然。👏';
  else comment = `很接近了！只有 “${words[miss]}” 没太跟上，跟着原声再读两遍就顺了。`;
  return { words, hits, transcript, hitCount, total: words.length, score, comment, missWord: miss>=0?words[miss]:null };
}

  const a = new Audio('./audio/' + rel);
  a.playbackRate = slow ? 0.75 : 1.0;
  a.play().catch(()=>{});
  _audio = a; return a;
}

function Chip({ children, t, tone='neutral', style }) {
  const tones = {
    neutral:{bg:t.surfaceAlt, fg:t.inkSoft}, accent:{bg:t.accentSoft, fg:t.accentDeep},

}
function PlantIcon({ size=24, t, day=0 }) {
  const lvl = day<3?0:day<7?1:day<14?2:3;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24">
      <path d="M6 17 L18 17 L17 22 L7 22 Z" fill={t.potFill} stroke={t.accentDeep} strokeWidth="1"/>
      <rect x="6" y="16" width="12" height="2" fill={t.accentDeep} opacity="0.5"/>
      {lvl>=0 && <path d={`M12 16 L12 ${16-(lvl+1)*2.5}`} stroke={t.sage} strokeWidth="1.5" strokeLinecap="round"/>}
      {lvl>=1 && <ellipse cx="9.5" cy="13" rx="2" ry="1.2" fill={t.sage} transform="rotate(-30 9.5 13)"/>}
      {lvl>=1 && <ellipse cx="14.5" cy="11" rx="2" ry="1.2" fill={t.sage} transform="rotate(30 14.5 11)"/>}
      {lvl>=2 && <ellipse cx="9" cy="9" rx="2.3" ry="1.3" fill={t.sage} transform="rotate(-30 9 9)"/>}
      {lvl>=2 && <ellipse cx="15" cy="7" rx="2.3" ry="1.3" fill={t.sage} transform="rotate(30 15 7)"/>}
      {lvl>=3 && <circle cx="12" cy="5" r="2" fill={t.accent}/>}
      {lvl>=3 && <circle cx="12" cy="5" r="0.8" fill={t.sun}/>}

}

// ═══════════════════════════════════════════════════════════════
// 定级测试
// ═══════════════════════════════════════════════════════════════
function PlacementTest({ t, onDone, onCancel }) {
  const [step, setStep] = React.useState(-1); // -1 intro, 0..n questions, 'result'
  const [correct, setCorrect] = React.useState(0);
  const [picked, setPicked] = React.useState(null);
  const total = PLACEMENT.length;

  if (step === -1) {
    return (
      <div style={{padding:'90px 24px 40px', background:t.bg, minHeight:'100%'}}>
        <div style={{width:64, height:64, borderRadius:20, background:t.accentSoft, display:'flex', alignItems:'center', justifyContent:'center', marginBottom:20}}>
          <Icon.Target size={32} color={t.accent}/>
        </div>
        <div style={{fontFamily:Tokens.font.zh, fontSize:26, fontWeight:600, color:t.ink, letterSpacing:-0.3, marginBottom:10}}>先测一测你的蓝思值</div>
        <div style={{fontFamily:Tokens.font.zh, fontSize:15, color:t.inkSoft, lineHeight:1.7, marginBottom:28}}>
          蓝思值（Lexile）是国际通用的英语难度标尺。花 2 分钟读几段话、答几道题，我们就知道该给你哪个难度的开口训练——
          <span style={{color:t.ink, fontWeight:600}}>和你在「原版娃精读」里测的是同一把尺子，一次测，两边通用。</span>
        </div>
        <div style={{background:t.surface, borderRadius:18, padding:16, border:`1px solid ${t.line}`, marginBottom:28, display:'flex', flexDirection:'column', gap:12}}>
          {[['📖','读一小段英文'],['✅','答 1 道理解题'],['📊','算出你的蓝思值 + 级别']].map(([e,txt],i)=>(
            <div key={i} style={{display:'flex', alignItems:'center', gap:12}}>
              <span style={{fontSize:18}}>{e}</span>
              <span style={{fontFamily:Tokens.font.zh, fontSize:14, color:t.ink}}>{txt}</span>
            </div>
          ))}
        </div>
        <PrimaryButton t={t} block onClick={()=>setStep(0)}>开始测试 <Icon.Chevron size={14} color="#fff"/></PrimaryButton>
        {onCancel && <button onClick={onCancel} style={{appearance:'none', border:0, background:'transparent', color:t.inkMuted, fontFamily:Tokens.font.zh, fontSize:13, marginTop:16, width:'100%', cursor:'pointer'}}>以后再测</button>}
      </div>
    );
  }

  if (step === 'result') {
    const ratio = correct/total;
    const lexile = Math.round(380 + ratio*820); // 380–1200L
    const band = lexileToBand(lexile);
    const st = Store.read();
    return (
      <div style={{padding:'80px 24px 40px', background:t.bg, minHeight:'100%', textAlign:'center'}}>
        <div className="fade-item" style={{fontFamily:Tokens.font.zh, fontSize:14, color:t.inkSoft, marginBottom:8}}>你的英语蓝思值约为</div>
        <div className="fade-item" style={{fontFamily:Tokens.font.enSans, fontSize:64, fontWeight:800, color:band.color, letterSpacing:-1, lineHeight:1, marginBottom:6, animation:'pop-in 0.5s ease both'}}>{lexile}<span style={{fontSize:30}}>L</span></div>
        <div className="fade-item" style={{marginBottom:24}}><BandBadge band={band} t={t}/></div>
        <div className="fade-item" style={{background:t.surface, borderRadius:20, padding:20, border:`1px solid ${t.line}`, marginBottom:16, textAlign:'left'}}>
          <div style={{fontFamily:Tokens.font.zh, fontSize:15, fontWeight:600, color:t.ink, marginBottom:6}}>{band.cefr} · {band.name}（{band.stage}）</div>
          <div style={{fontFamily:Tokens.font.zh, fontSize:13.5, color:t.inkSoft, lineHeight:1.7}}>
            我们会从 <span style={{color:t.ink, fontWeight:600}}>{band.range}</span> 难度的内容开始陪你开口。说顺了可以升档挑战，觉得吃力随时降档悦练。
          </div>
        </div>
        <div className="fade-item" style={{display:'flex', alignItems:'center', gap:8, justifyContent:'center', color:t.inkMuted, fontFamily:Tokens.font.zh, fontSize:12, marginBottom:28}}>
          <Icon.Chart size={14} color={t.inkMuted}/> 这是你的第一次测评，之后会画出你的进步轨迹
        </div>
        <PrimaryButton t={t} block onClick={()=>{
          const hist = (st.history||[]).concat([{lexile, at:Date.now()}]);
          Store.write({ band: band.id, lexile, history: hist, placed:true });
          onDone(band.id);
        }}>设为我的级别，开始训练</PrimaryButton>
      </div>
    );
  }

  const Q = PLACEMENT[step];
  const band = bandById(Q.lvl + (Q.lvl>=3?1:0)); // 仅用于配色提示
  return (
    <div style={{padding:'70px 22px 40px', background:t.bg, minHeight:'100%'}}>
      <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:24}}>
        {onCancel && <button onClick={onCancel} style={{appearance:'none', border:0, background:'transparent', cursor:'pointer', padding:0}}><Icon.Close size={20} color={t.inkSoft}/></button>}
        <div style={{flex:1, height:6, background:t.surfaceAlt, borderRadius:9999, overflow:'hidden'}}>
          <div style={{width:`${(step/total)*100}%`, height:'100%', background:t.accent, borderRadius:9999, transition:'width 0.4s'}}/>
        </div>
        <span style={{fontFamily:Tokens.font.enSans, fontSize:13, color:t.inkSoft, fontWeight:600}}>{step+1}/{total}</span>
      </div>
      <Chip t={t} tone="neutral" style={{marginBottom:16}}>阅读理解 · 难度递增</Chip>
      <div style={{background:t.surface, borderRadius:18, padding:18, border:`1px solid ${t.line}`, marginBottom:20}}>
        <div style={{fontFamily:Tokens.font.en, fontSize:19, color:t.ink, lineHeight:1.5}}>{Q.passage}</div>
      </div>
      <div style={{fontFamily:Tokens.font.zh, fontSize:15, fontWeight:600, color:t.ink, marginBottom:14}}>{Q.q}</div>
      <div style={{display:'flex', flexDirection:'column', gap:10}}>
        {Q.options.map((op,i)=>{
          const on = picked === i;
          return (
            <button key={i} onClick={()=>setPicked(i)} style={{
              appearance:'none', cursor:'pointer', textAlign:'left', padding:'14px 16px', borderRadius:14,
              border:`1.5px solid ${on?t.accent:t.line}`, background: on?t.accentSoft:t.surface,
              fontFamily:Tokens.font.enSans, fontSize:15, color:t.ink, display:'flex', alignItems:'center', gap:10,
            }}>
              <span style={{width:22, height:22, borderRadius:9999, border:`1.5px solid ${on?t.accent:t.inkMuted}`, background:on?t.accent:'transparent', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>
                {on && <Icon.Check size={13} color="#fff"/>}
              </span>
              {op}
            </button>
          );
        })}
      </div>
      <div style={{marginTop:24}}>
        <PrimaryButton t={t} block disabled={picked===null} onClick={()=>{
          if (picked === Q.answer) setCorrect(c=>c+1);
          setPicked(null);
          if (step < total-1) setStep(step+1); else setStep('result');
        }}>{step < total-1 ? '下一题' : '看我的蓝思值'}</PrimaryButton>
      </div>
    </div>
  );
}

function TodayScreen({ t, bandId, onOpenUnit, onRetest, streak }) {

  const todays = UNITS.filter(u => Math.abs(u.bandId - bandId) <= 1);

  return (

        {new Date().toLocaleDateString('zh-CN',{month:'long', day:'numeric', weekday:'long'})}
      </div>
      <div style={{fontFamily:Tokens.font.zh, fontSize:25, fontWeight:600, color:t.ink, letterSpacing:-0.3, marginBottom:4}}>早上好，今天也开口 5 分钟</div>
      <div style={{display:'flex', alignItems:'center', gap:10, marginTop:14, marginBottom:20}}>

function UnitRow({ unit, t, onClick }) {

  const st = Store.read();
  const prog = (st.progress||{})[unit.id];
  return (
    <button onClick={onClick} style={{appearance:'none', border:`1px solid ${t.line}`, background:t.surface, borderRadius:18, padding:13, textAlign:'left', cursor:'pointer', display:'flex', alignItems:'center', gap:13, width:'100%'}}>

      <div style={{flex:1, minWidth:0}}>
        <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:3}}>
          <span style={{fontFamily:Tokens.font.zh, fontSize:15, fontWeight:600, color:t.ink}}>{unit.title}</span>
          {unit.source==='article' && <Chip t={t} tone="neutral" style={{padding:'1px 7px', fontSize:10}}>读后说</Chip>}
        </div>
        <div style={{display:'flex', alignItems:'center', gap:8, fontFamily:Tokens.font.zh, fontSize:11.5, color:t.inkSoft}}>
          <BandBadge band={band} t={t} size="sm"/>
          <span>{THEMES[unit.themeId]}</span>

}

// 训练（band 切换 + 单元库）

function TrainScreen({ t, myBand, onOpenUnit }) {
  const [viewBand, setViewBand] = React.useState(myBand);
  const list = UNITS.filter(u => u.bandId === viewBand);

  return (
    <div style={{padding:'66px 0 120px', background:t.bg, minHeight:'100%'}}>
      <div style={{padding:'0 20px 4px'}}>
        <div style={{fontFamily:Tokens.font.zh, fontSize:26, fontWeight:600, color:t.ink, letterSpacing:-0.3}}>训练</div>
        <div style={{fontFamily:Tokens.font.zh, fontSize:13, color:t.inkSoft, marginTop:2}}>按蓝思难度开口，读得懂才说得出</div>
      </div>
      {/* band 切换器 */}
      <div className="no-bar" style={{display:'flex', gap:8, overflowX:'auto', padding:'16px 20px 10px'}}>
        {BANDS.map(b=>{
          const on = viewBand===b.id;
          return (
            <button key={b.id} onClick={()=>setViewBand(b.id)} style={{
              appearance:'none', cursor:'pointer', flexShrink:0, borderRadius:16, padding:'10px 14px', textAlign:'center',

              minWidth:64,
            }}>
              <div style={{fontFamily:Tokens.font.enSans, fontSize:15, fontWeight:800, color: on?b.color:t.inkSoft}}>{b.cefr}</div>
              <div style={{fontFamily:Tokens.font.zh, fontSize:11, color: on?(t===Tokens.palettes.dusk?'#fff':b.color):t.inkMuted, marginTop:2}}>{b.name}</div>
              {b.id===myBand && <div style={{fontSize:9, color:t.accent, marginTop:3, fontFamily:Tokens.font.zh}}>我的</div>}

          );
        })}
      </div>
      <div style={{padding:'0 20px', display:'flex', alignItems:'center', gap:8, marginBottom:14}}>
        <BandBadge band={bandById(viewBand)} t={t} size="sm"/>

      </div>
    </div>
  );
}

// 我的（进步轨迹 + 统计）
// ═══════════════════════════════════════════════════════════════
function MeScreen({ t, bandId, streak, onRetest }) {
  const band = bandById(bandId);
  const st = Store.read();
  const hist = st.history || [];
  const doneCount = Object.values(st.progress||{}).filter(v=>v==='done').length;
  const maxL = 1300, minL = 300;
  return (
    <div style={{padding:'66px 20px 120px', background:t.bg, minHeight:'100%'}}>
      <div style={{display:'flex', alignItems:'center', gap:14, marginBottom:22}}>
        <div style={{width:58, height:58, borderRadius:9999, background:`radial-gradient(circle at 30% 30%, ${t.accent}, ${t.accentDeep})`, display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', fontFamily:Tokens.font.en, fontSize:26, fontWeight:600}}>N</div>
        <div>
          <div style={{fontFamily:Tokens.font.zh, fontSize:19, fontWeight:600, color:t.ink}}>Nova</div>
          <div style={{marginTop:4}}><BandBadge band={band} t={t} size="sm"/></div>
        </div>
      </div>
      {/* 统计 */}
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10, marginBottom:18}}>
        {[[streak,'连续天数'],[doneCount,'通关单元'],[(st.spokenSents||0),'已开口句']].map(([v,l],i)=>(
          <div key={i} style={{background:t.surface, borderRadius:16, padding:'16px 8px', border:`1px solid ${t.line}`, textAlign:'center'}}>
            <div style={{fontFamily:Tokens.font.enSans, fontSize:24, fontWeight:800, color:t.ink}}>{v}</div>
            <div style={{fontFamily:Tokens.font.zh, fontSize:11, color:t.inkSoft, marginTop:2}}>{l}</div>
          </div>
        ))}
      </div>
      {/* 蓝思进步轨迹 */}
      <div style={{background:t.surface, borderRadius:20, padding:18, border:`1px solid ${t.line}`, marginBottom:16}}>
        <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:14}}>
          <Icon.Chart size={16} color={t.accent}/>
          <span style={{fontFamily:Tokens.font.zh, fontSize:15, fontWeight:600, color:t.ink}}>蓝思进步轨迹</span>
        </div>
        {hist.length >= 2 ? (
          <div>
            <svg width="100%" height="90" viewBox="0 0 300 90" preserveAspectRatio="none">
              <polyline fill="none" stroke={t.accent} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
                points={hist.map((h,i)=>`${(i/(hist.length-1))*290+5},${85-((h.lexile-minL)/(maxL-minL))*75}`).join(' ')}/>
              {hist.map((h,i)=>(<circle key={i} cx={(i/(hist.length-1))*290+5} cy={85-((h.lexile-minL)/(maxL-minL))*75} r="4" fill={t.accent}/>))}
            </svg>
            <div style={{display:'flex', justifyContent:'space-between', marginTop:6, fontFamily:Tokens.font.enSans, fontSize:11, color:t.inkMuted}}>
              <span>{hist[0].lexile}L</span><span style={{color:t.accent, fontWeight:700}}>{hist[hist.length-1].lexile}L 现在</span>
            </div>
          </div>
        ) : (
          <div style={{textAlign:'center', padding:'10px 0 4px'}}>
            <div style={{fontFamily:Tokens.font.enSans, fontSize:30, fontWeight:800, color:band.color}}>{st.lexile||band.lo}L</div>
            <div style={{fontFamily:Tokens.font.zh, fontSize:12, color:t.inkSoft, margin:'6px 0 14px'}}>多测几次，这里会画出你的成长曲线</div>
            <GhostButton t={t} small onClick={onRetest}>重新测一次蓝思值</GhostButton>
          </div>
        )}
      </div>
      <button onClick={onRetest} style={{appearance:'none', border:`1px solid ${t.line}`, background:t.surface, borderRadius:16, padding:'14px 16px', width:'100%', display:'flex', alignItems:'center', gap:12, cursor:'pointer'}}>
        <Icon.Target size={18} color={t.inkSoft}/>
        <span style={{flex:1, textAlign:'left', fontFamily:Tokens.font.zh, fontSize:14, color:t.ink}}>重新测蓝思值</span>
        <Icon.Chevron size={15} color={t.inkMuted}/>
      </button>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 段 1：跟读 Shadow（含轻反馈）
// ═══════════════════════════════════════════════════════════════
function ShadowStage({ t, unit, onBack, onDone }) {
  const sents = unit.shadow;
  const [idx, setIdx] = React.useState(0);
  const [phase, setPhase] = React.useState('idle'); // idle / recording / analyzing / feedback
  const [result, setResult] = React.useState(null);
  const [slow, setSlow] = React.useState(false);
  const s = sents[idx];

  const handleMic = () => {
    if (phase === 'recording') { // 结束录音 → 分析
      setPhase('analyzing');
      setTimeout(()=>{ setResult(mockShadowResult(s)); setPhase('feedback'); }, 1100);
    } else if (phase === 'idle' || phase === 'feedback') {
      setResult(null); setPhase('recording');
    }
  };
  const next = () => {
    if (idx < sents.length-1) { setIdx(idx+1); setPhase('idle'); setResult(null); }
    else onDone();
  };

  return (
    <div style={{background:t.bg, minHeight:'100%', display:'flex', flexDirection:'column'}}>
      <div style={{padding:'56px 20px 12px', display:'flex', alignItems:'center', gap:12}}>
        <button onClick={onBack} style={{appearance:'none', border:0, background:'transparent', cursor:'pointer'}}><Icon.Close size={20} color={t.inkSoft}/></button>
        <div style={{flex:1, height:6, background:t.surfaceAlt, borderRadius:9999, overflow:'hidden'}}><div style={{width:`${((idx+1)/sents.length)*100}%`, height:'100%', background:t.accent, borderRadius:9999, transition:'width 0.4s'}}/></div>
        <span style={{fontFamily:Tokens.font.enSans, fontSize:13, color:t.inkSoft, fontWeight:600}}>{idx+1}/{sents.length}</span>
      </div>
      <div style={{padding:'0 20px 8px'}}><Chip t={t} tone="accent"><Icon.Volume size={12} color={t.accentDeep}/> 跟读 · {unit.title}</Chip></div>

      <div style={{padding:'10px 22px', flex:1, display:'flex', flexDirection:'column'}}>
        <div style={{fontFamily:Tokens.font.zh, fontSize:14, color:t.inkSoft, marginBottom:14}}>{s.zh}</div>
        {/* 英文句子，反馈态逐词高亮 */}
        <div style={{fontFamily:Tokens.font.en, fontSize:32, color:t.ink, lineHeight:1.35, marginBottom:22}}>
          {s.words.map((w,i)=>{
            const bad = phase==='feedback' && result && !result.hits[i];
            return <span key={i} style={{color: bad?t.danger:t.ink, textDecoration: bad?'underline wavy':'none', textDecorationColor: bad?t.danger:undefined, textUnderlineOffset:6}}>{w}{i<s.words.length-1?' ':''}</span>;
          })}
        </div>
        {/* 听原声 */}
        <div style={{display:'flex', gap:10, marginBottom:20}}>
          <button onClick={()=>playClip(s.audio, slow)} style={{appearance:'none', cursor:'pointer', border:`1px solid ${t.line}`, background:t.surface, borderRadius:9999, padding:'10px 16px', display:'flex', alignItems:'center', gap:8, fontFamily:Tokens.font.zh, fontSize:13, color:t.ink, fontWeight:500}}>
            <Icon.Volume size={16} color={t.accent}/> 听 Rosie 读 {!s.audio && <span style={{fontSize:11, color:t.inkMuted}}>（示意）</span>}
          </button>
          <button onClick={()=>setSlow(v=>!v)} style={{appearance:'none', cursor:'pointer', border:`1px solid ${slow?t.accent:t.line}`, background:slow?t.accentSoft:t.surface, borderRadius:9999, padding:'10px 14px', fontFamily:Tokens.font.zh, fontSize:13, color:slow?t.accentDeep:t.inkSoft, fontWeight:500}}>0.75× 慢速</button>
        </div>

        {/* 反馈卡 */}
        {phase==='feedback' && result && (
          <div className="fade-item" style={{background:t.surface, borderRadius:20, padding:16, border:`1px solid ${t.line}`, marginBottom:16}}>
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:12}}>
              <div style={{width:40, height:40, borderRadius:9999, background: result.score>=85?t.sageSoft:t.sunSoft, display:'flex', alignItems:'center', justifyContent:'center'}}>
                {result.score>=85 ? <Icon.Check size={20} color={t.sage}/> : <span style={{fontSize:18}}>💪</span>}
              </div>
              <div>
                <div style={{fontFamily:Tokens.font.zh, fontSize:15, fontWeight:600, color:t.ink}}>{result.hitCount}/{result.total} 个词跟上了</div>
                <div style={{fontFamily:Tokens.font.zh, fontSize:12, color:t.inkSoft}}>{result.score>=85?'非常清楚':'再来一次会更好'}</div>
              </div>
            </div>
            {/* ASR 转写比对 */}
            <div style={{background:t.surfaceAlt, borderRadius:12, padding:'10px 12px', marginBottom:12}}>
              <div style={{fontFamily:Tokens.font.zh, fontSize:11, color:t.inkMuted, marginBottom:4}}>识别到你说的：</div>
              <div style={{fontFamily:Tokens.font.enSans, fontSize:14, color:t.ink}}>{result.transcript}</div>
            </div>
            {/* 回放对比 */}
            <div style={{display:'flex', gap:10, marginBottom:12}}>
              <button onClick={()=>{}} style={{flex:1, appearance:'none', cursor:'pointer', border:`1px solid ${t.line}`, background:'transparent', borderRadius:12, padding:'9px 0', display:'flex', alignItems:'center', justifyContent:'center', gap:6, fontFamily:Tokens.font.zh, fontSize:12.5, color:t.ink}}><Icon.Replay size={15} color={t.sage}/> 听我的录音</button>
              <button onClick={()=>playClip(s.audio, false)} style={{flex:1, appearance:'none', cursor:'pointer', border:`1px solid ${t.line}`, background:'transparent', borderRadius:12, padding:'9px 0', display:'flex', alignItems:'center', justifyContent:'center', gap:6, fontFamily:Tokens.font.zh, fontSize:12.5, color:t.ink}}><Icon.Volume size={15} color={t.accent}/> 听 Rosie 的</button>
            </div>
            {/* AI 点评 */}
            <div style={{display:'flex', gap:10, alignItems:'flex-start'}}>
              <div style={{width:26, height:26, borderRadius:9999, background:t.accent, color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:Tokens.font.en, fontSize:14, fontWeight:600, flexShrink:0}}>R</div>
              <div style={{background:t.accentSoft, borderRadius:'4px 14px 14px 14px', padding:'10px 13px', fontFamily:Tokens.font.zh, fontSize:13, color:t.accentDeep, lineHeight:1.6}}>{result.comment}</div>
            </div>
          </div>
        )}
      </div>

      {/* 底部操作区 */}
      <div style={{padding:'8px 22px 36px', background:`linear-gradient(to top, ${t.bg} 70%, ${hexA(t.bg,0)})`}}>
        {phase==='feedback'
          ? <div style={{display:'flex', gap:10}}>
              <GhostButton t={t} onClick={()=>{setPhase('idle'); setResult(null);}} style={{flex:1}}>再读一次</GhostButton>
              <PrimaryButton t={t} onClick={next} style={{flex:2}}>{idx<sents.length-1?'下一句':'完成跟读 ✓'}</PrimaryButton>
            </div>
          : <div style={{display:'flex', justifyContent:'center'}}><MicButton t={t} phase={phase} onClick={handleMic} label="点麦克风跟读"/></div>}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 段 2：复述 Retell
// ═══════════════════════════════════════════════════════════════
function RetellStage({ t, unit, onBack, onDone }) {
  const r = unit.retell;
  const [phase, setPhase] = React.useState('idle'); // idle / recording / analyzing / done
  const [showSample, setShowSample] = React.useState(false);

  const handleMic = () => {
    if (phase==='recording') { setPhase('analyzing'); setTimeout(()=>setPhase('done'), 1300); }
    else setPhase('recording');
  };
  return (
    <div style={{background:t.bg, minHeight:'100%', display:'flex', flexDirection:'column'}}>
      <div style={{padding:'56px 20px 12px', display:'flex', alignItems:'center', gap:12}}>
        <button onClick={onBack} style={{appearance:'none', border:0, background:'transparent', cursor:'pointer'}}><Icon.Back size={20} color={t.inkSoft}/></button>
        <Chip t={t} tone="sage"><Icon.Mic size={12} color={t===Tokens.palettes.dusk?t.sage:'#4E6A4A'}/> 复述 · 第 2 段</Chip>
      </div>
      <div style={{padding:'14px 22px', flex:1, display:'flex', flexDirection:'column'}}>
        <div style={{fontFamily:Tokens.font.zh, fontSize:22, fontWeight:600, color:t.ink, lineHeight:1.4, marginBottom:8}}>{r.prompt}</div>
        <div style={{fontFamily:Tokens.font.zh, fontSize:13, color:t.inkSoft, marginBottom:18}}>不用背原句，用你自己的话说就好。</div>
        {/* 要点提示 */}
        <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:20}}>
          {r.points.map((p,i)=>(<span key={i} style={{display:'inline-flex', alignItems:'center', gap:5, padding:'8px 12px', borderRadius:9999, background:t.surface, border:`1px solid ${t.line}`, fontFamily:Tokens.font.zh, fontSize:13, color:t.ink}}><Icon.Bulb size={13} color={t.sage}/> {p}</span>))}
        </div>

        {phase==='done' && (
          <div className="fade-item" style={{background:t.surface, borderRadius:20, padding:16, border:`1px solid ${t.line}`, marginBottom:16}}>
            <div style={{display:'flex', gap:10, alignItems:'flex-start', marginBottom:12}}>
              <div style={{width:26, height:26, borderRadius:9999, background:t.sage, color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:Tokens.font.en, fontSize:14, fontWeight:600, flexShrink:0}}>R</div>
              <div style={{background:t.sageSoft, borderRadius:'4px 14px 14px 14px', padding:'10px 13px', fontFamily:Tokens.font.zh, fontSize:13, color:t===Tokens.palettes.dusk?t.sage:'#4E6A4A', lineHeight:1.6}}>
                抓到了「{r.points[0]}」和「{r.points[r.points.length-1]}」两个要点，说得很完整！下次可以试着把句子连起来，更流利。
              </div>
            </div>
            <button onClick={()=>setShowSample(v=>!v)} style={{appearance:'none', border:0, background:'transparent', cursor:'pointer', display:'flex', alignItems:'center', gap:6, fontFamily:Tokens.font.zh, fontSize:12.5, color:t.accent, fontWeight:600}}>
              <Icon.Sparkle size={13} color={t.accent}/> {showSample?'收起参考说法':'看一个参考说法'}
            </button>
            {showSample && <div className="fade-item" style={{marginTop:10, padding:'10px 12px', background:t.surfaceAlt, borderRadius:12, fontFamily:Tokens.font.en, fontSize:14.5, color:t.ink, lineHeight:1.5, fontStyle:'italic'}}>"{r.sample}"</div>}
          </div>
        )}
      </div>
      <div style={{padding:'8px 22px 36px', background:`linear-gradient(to top, ${t.bg} 70%, ${hexA(t.bg,0)})`}}>
        {phase==='done'
          ? <PrimaryButton t={t} block onClick={onDone}>进入对话 · 第 3 段 <Icon.Chevron size={14} color="#fff"/></PrimaryButton>
          : <div style={{display:'flex', justifyContent:'center'}}><MicButton t={t} phase={phase} onClick={handleMic} label="点麦克风，开始复述"/></div>}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 段 3：对话 Talk（多轮 + 内联纠错）
// ═══════════════════════════════════════════════════════════════
function TalkStage({ t, unit, onBack, onDone }) {
  const turns = unit.talk.turns;
  const [msgs, setMsgs] = React.useState([{ from:'ai', text: turns[0].ai, hint: turns[0].hintZh }]);
  const [turnIdx, setTurnIdx] = React.useState(0);
  const [phase, setPhase] = React.useState('idle'); // idle / recording / analyzing
  const [ended, setEnded] = React.useState(false);
  const scrollRef = React.useRef(null);

  React.useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [msgs, phase]);

  const userLineFor = (i) => {
    const samples = ["My name is Nova.", "I'm from Shanghai.", "I work as a product designer.", "Thanks, you too!"];
    return samples[i] || "Okay, sounds good!";
  };

  const handleMic = () => {
    if (phase==='recording') {
      setPhase('analyzing');
      const cur = turns[turnIdx];
      setTimeout(()=>{
        // 用户这轮的"转写"气泡（可能带内联纠错）
        const userMsg = { from:'user', text: userLineFor(turnIdx), correction: cur.correctionSample||null };
        const nextIdx = turnIdx+1;
        const aiNext = turns[nextIdx];
        setMsgs(m=>[...m, userMsg]);
        setPhase('idle');
        setTurnIdx(nextIdx);
        setTimeout(()=>{
          if (aiNext) {
            setMsgs(m=>[...m, { from:'ai', text: aiNext.ai, hint: aiNext.hintZh }]);
            if (aiNext.last) setEnded(true);
          }
        }, 500);
      }, 1100);
    } else setPhase('recording');
  };

  const curHint = !ended && turns[turnIdx] ? turns[turnIdx].hintZh : null;

  return (
    <div style={{background:t.bg, minHeight:'100%', display:'flex', flexDirection:'column', height:844}}>
      <div style={{padding:'56px 20px 12px', display:'flex', alignItems:'center', gap:12, borderBottom:`1px solid ${t.line}`}}>
        <button onClick={onBack} style={{appearance:'none', border:0, background:'transparent', cursor:'pointer'}}><Icon.Back size={20} color={t.inkSoft}/></button>
        <div style={{width:34, height:34, borderRadius:9999, background:`radial-gradient(circle at 30% 30%, ${t.sun}, ${t.accent})`, color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:Tokens.font.en, fontSize:16, fontWeight:600}}>R</div>
        <div style={{flex:1}}>
          <div style={{fontFamily:Tokens.font.zh, fontSize:15, fontWeight:600, color:t.ink}}>Rosie</div>
          <div style={{fontFamily:Tokens.font.zh, fontSize:11, color:t.inkMuted}}>{unit.talk.scene}</div>
        </div>
        <Chip t={t} tone="sun">对话</Chip>
      </div>

      {/* 消息区 */}
      <div ref={scrollRef} className="no-bar" style={{flex:1, overflowY:'auto', padding:'18px 18px 8px', display:'flex', flexDirection:'column', gap:14}}>
        {msgs.map((m,i)=>(
          m.from==='ai' ? (
            <div key={i} className="fade-item" style={{display:'flex', gap:9, alignItems:'flex-start', maxWidth:'85%'}}>
              <div style={{width:28, height:28, borderRadius:9999, background:`radial-gradient(circle at 30% 30%, ${t.sun}, ${t.accent})`, color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:Tokens.font.en, fontSize:14, fontWeight:600, flexShrink:0}}>R</div>
              <div style={{background:t.surface, border:`1px solid ${t.line}`, borderRadius:'4px 16px 16px 16px', padding:'11px 14px', fontFamily:Tokens.font.enSans, fontSize:15, color:t.ink, lineHeight:1.5}}>{m.text}</div>
            </div>
          ) : (
            <div key={i} className="fade-item" style={{alignSelf:'flex-end', maxWidth:'85%'}}>
              <div style={{background:t.accent, color:'#fff', borderRadius:'16px 4px 16px 16px', padding:'11px 14px', fontFamily:Tokens.font.enSans, fontSize:15, lineHeight:1.5}}>{m.text}</div>
              {m.correction && (
                <div style={{marginTop:6, background:t.sunSoft, borderRadius:12, padding:'8px 11px', display:'flex', gap:7, alignItems:'flex-start'}}>
                  <Icon.Sparkle size={13} color={t===Tokens.palettes.dusk?t.sun:'#9C7A1F'}/>
                  <div style={{fontFamily:Tokens.font.zh, fontSize:12, color:t===Tokens.palettes.dusk?t.sun:'#9C7A1F', lineHeight:1.5}}>
                    <span style={{textDecoration:'line-through', opacity:0.6}}>{m.correction.from}</span> → <span style={{fontWeight:600}}>{m.correction.to}</span><br/>{m.correction.note}
                  </div>
                </div>
              )}
            </div>
          )
        ))}
        {phase==='analyzing' && (
          <div style={{alignSelf:'flex-end', background:hexA(t.accent,0.5), borderRadius:'16px 4px 16px 16px', padding:'12px 16px'}}><MiniWave t={t} color="#fff" n={6}/></div>
        )}
      </div>

      {/* 输入区 */}
      <div style={{padding:'10px 20px 34px', borderTop:`1px solid ${t.line}`, background:t.bg}}>
        {ended ? (
          <PrimaryButton t={t} block onClick={onDone}>对话完成，看看成果 <Icon.Chevron size={14} color="#fff"/></PrimaryButton>
        ) : (
          <div style={{display:'flex', alignItems:'center', gap:14}}>
            <button onClick={handleMic} style={{appearance:'none', border:0, cursor:'pointer', width:60, height:60, borderRadius:9999, background: phase==='recording'?t.danger:t.accent, boxShadow:`0 8px 20px ${hexA(phase==='recording'?t.danger:t.accent,0.35)}`, display:'flex', alignItems:'center', justifyContent:'center', position:'relative', flexShrink:0}}>
              {phase==='recording' && <span style={{position:'absolute', inset:0, borderRadius:9999, border:`3px solid ${t.danger}`, animation:'ringpulse 1.4s ease-out infinite'}}/>}
              {phase==='analyzing' ? <span style={{width:20, height:20, border:'3px solid rgba(255,255,255,0.4)', borderTopColor:'#fff', borderRadius:9999, animation:'spin 0.8s linear infinite'}}/> : phase==='recording' ? <span style={{width:20, height:20, borderRadius:5, background:'#fff'}}/> : <Icon.Mic size={26} color="#fff" sw={2}/>}
            </button>
            <div style={{flex:1}}>
              {phase==='recording'
                ? <span style={{fontFamily:Tokens.font.zh, fontSize:13.5, color:t.danger, fontWeight:500}}>正在听你说…（点一下结束）</span>
                : <>
                    <div style={{fontFamily:Tokens.font.zh, fontSize:13.5, color:t.ink, fontWeight:500}}>轮到你了</div>
                    {curHint && <div style={{display:'flex', alignItems:'center', gap:5, marginTop:3}}><Icon.Bulb size={12} color={t.inkMuted}/><span style={{fontFamily:Tokens.font.zh, fontSize:12, color:t.inkMuted}}>提示：{curHint}</span></div>}
                  </>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 单元结果（通关章）
// ═══════════════════════════════════════════════════════════════
function UnitResult({ t, unit, onHome, onNext }) {
  const band = bandById(unit.bandId);
  const next = UNITS.find(u=>u.id!==unit.id && Math.abs(u.bandId-unit.bandId)<=1);
  return (
    <div style={{background:t.bg, minHeight:'100%', padding:'80px 24px 40px', textAlign:'center', position:'relative', overflow:'hidden'}}>
      {[...Array(8)].map((_,i)=>(<div key={i} style={{position:'absolute', top:`${10+Math.random()*30}%`, left:`${10+i*10}%`, width:8, height:8, borderRadius:i%2?9999:2, background:[t.accent,t.sage,t.sun][i%3], animation:`confetti-in 0.6s ease ${i*0.08}s both`}}/>))}
      <div style={{position:'relative'}}>
        <div style={{width:96, height:96, borderRadius:9999, margin:'0 auto 20px', background:`radial-gradient(circle at 30% 30%, ${t.sun}, ${t.accent})`, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:`0 16px 40px ${hexA(t.accent,0.35)}`, animation:'pop-in 0.5s ease both'}}>
          <Icon.Trophy size={44} color="#fff"/>
        </div>
        <div style={{fontFamily:Tokens.font.zh, fontSize:24, fontWeight:700, color:t.ink, marginBottom:8}}>通关！你开口了 🎉</div>
        <div style={{fontFamily:Tokens.font.zh, fontSize:14, color:t.inkSoft, lineHeight:1.7, marginBottom:24}}>
          你完成了「{unit.title}」的<span style={{color:t.ink, fontWeight:600}}>跟读 → 复述 → 对话</span>三段训练。<br/>真实场景里，你已经能把这些话说出口了。
        </div>
        <div style={{display:'flex', gap:10, marginBottom:28}}>
          {[['🗣️','开口', `${unit.shadow.length+unit.talk.turns.length} 句`],['🔥','连续', `${Store.read().streak||1} 天`],['📊','难度', band.cefr]].map(([e,l,v],i)=>(
            <div key={i} style={{flex:1, background:t.surface, borderRadius:16, padding:'14px 6px', border:`1px solid ${t.line}`}}>
              <div style={{fontSize:20, marginBottom:4}}>{e}</div>
              <div style={{fontFamily:Tokens.font.enSans, fontSize:16, fontWeight:700, color:t.ink}}>{v}</div>
              <div style={{fontFamily:Tokens.font.zh, fontSize:11, color:t.inkSoft, marginTop:1}}>{l}</div>
            </div>
          ))}
        </div>
        {next && <PrimaryButton t={t} block onClick={()=>onNext(next)} style={{marginBottom:12}}>继续下一个 · {next.title} <Icon.Chevron size={14} color="#fff"/></PrimaryButton>}
        <GhostButton t={t} block onClick={onHome}>回今日</GhostButton>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// Phone 外壳 + 底部 tab
// ═══════════════════════════════════════════════════════════════
function Phone({ t, dark, tab, setTab, children, noChrome }) {
  const tabs = [{k:'today', label:'今日', icon:Icon.Today},{k:'train', label:'训练', icon:Icon.Grid},{k:'me', label:'我的', icon:Icon.User}];
  return (
    <IOSDevice dark={dark}>
      <div style={{position:'absolute', inset:0, background:t.bg, overflow:'hidden'}}>
        <div style={{position:'absolute', top:0, left:0, right:0, zIndex:5, pointerEvents:'none'}}><IOSStatusBar dark={dark}/></div>
        <div className="no-bar" style={{position:'absolute', top:0, left:0, right:0, bottom:0, overflowY:'auto'}}>{children}</div>
        {!noChrome && (
          <div style={{position:'absolute', bottom:0, left:0, right:0, zIndex:40, paddingBottom:26, paddingTop:8, paddingLeft:12, paddingRight:12, background:`linear-gradient(to top, ${t.bg} 62%, ${hexA(t.bg,0)})`}}>
            <div style={{background:t.surface, borderRadius:26, boxShadow:Tokens.shadow.md, border:`1px solid ${t.line}`, display:'flex', padding:6, gap:2}}>
              {tabs.map(tb=>{
                const on = tab===tb.k; const IconC = tb.icon;
                return (
                  <button key={tb.k} onClick={()=>setTab(tb.k)} style={{flex:1, appearance:'none', border:0, background: on?t.accentSoft:'transparent', color: on?t.accentDeep:t.inkMuted, borderRadius:20, padding:'9px 4px', display:'flex', flexDirection:'column', alignItems:'center', gap:4, cursor:'pointer', fontFamily:Tokens.font.zh}}>
                    <IconC color={on?t.accentDeep:t.inkMuted} size={22} sw={on?2.1:1.7}/>
                    <span style={{fontSize:11, fontWeight:on?600:500}}>{tb.label}</span>
                  </button>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </IOSDevice>
  );
}

// ═══════════════════════════════════════════════════════════════
// App
// ═══════════════════════════════════════════════════════════════
function App() {
  const [palette, setPalette] = React.useState('cream');
  const t = Tokens.palettes[palette];
  const dark = palette === 'dusk';

  const init = Store.read();
  const [bandId, setBandId] = React.useState(init.band || null);
  const [flow, setFlow] = React.useState(init.band ? 'app' : 'placement'); // placement / app / unit
  const [tab, setTab] = React.useState('today');
  const [unit, setUnit] = React.useState(null);
  const [stage, setStage] = React.useState('overview'); // overview / shadow / retell / talk / result
  const streak = init.streak || 12;

  React.useEffect(()=>{ document.body.className = dark ? 'theme-dusk' : ''; }, [dark]);

  const openUnit = (u) => { setUnit(u); setStage('overview'); setFlow('unit'); };
  const finishUnit = () => {
    const st = Store.read();
    Store.write({ progress: {...(st.progress||{}), [unit.id]:'done'}, spokenSents:(st.spokenSents||0)+unit.shadow.length+unit.talk.turns.length });
    setStage('result');
  };

  // 定级流程
  if (flow === 'placement') {
    return (
      <Shell t={t} dark={dark} palette={palette} setPalette={setPalette}>
        <Phone t={t} dark={dark} noChrome tab={tab} setTab={setTab}>
          <div className="screen-fade"><PlacementTest t={t} onDone={(bid)=>{ setBandId(bid); setFlow('app'); setTab('today'); }} onCancel={bandId?()=>setFlow('app'):null}/></div>
        </Phone>
      </Shell>
    );
  }

  // 单元三段式流程
  if (flow === 'unit' && unit) {
    let screen;
    if (stage==='overview') screen = <UnitOverview t={t} unit={unit} onBack={()=>setFlow('app')} onStart={()=>setStage('shadow')}/>;
    else if (stage==='shadow') screen = <ShadowStage t={t} unit={unit} onBack={()=>setFlow('app')} onDone={()=>setStage('retell')}/>;
    else if (stage==='retell') screen = <RetellStage t={t} unit={unit} onBack={()=>setStage('shadow')} onDone={()=>setStage('talk')}/>;
    else if (stage==='talk') screen = <TalkStage t={t} unit={unit} onBack={()=>setStage('retell')} onDone={finishUnit}/>;
    else if (stage==='result') screen = <UnitResult t={t} unit={unit} onHome={()=>{ setFlow('app'); setTab('today'); }} onNext={(u)=>openUnit(u)}/>;
    return (
      <Shell t={t} dark={dark} palette={palette} setPalette={setPalette}>
        <Phone t={t} dark={dark} noChrome tab={tab} setTab={setTab}><div className="screen-fade" key={stage}>{screen}</div></Phone>
      </Shell>
    );
  }

  // 主应用
  let main;
  if (tab==='today') main = <TodayScreen t={t} bandId={bandId} streak={streak} onOpenUnit={openUnit} onRetest={()=>setFlow('placement')}/>;
  else if (tab==='train') main = <TrainScreen t={t} myBand={bandId} onOpenUnit={openUnit}/>;
  else main = <MeScreen t={t} bandId={bandId} streak={streak} onRetest={()=>setFlow('placement')}/>;
  return (
    <Shell t={t} dark={dark} palette={palette} setPalette={setPalette}>
      <Phone t={t} dark={dark} tab={tab} setTab={setTab}><div className="screen-fade" key={tab}>{main}</div></Phone>
    </Shell>
  );
}

// 外层舞台 + 主题切换 + 原型标
function Shell({ t, dark, palette, setPalette, children }) {
  return (
    <div className="stage">
      <div className="theme-switch-wrap"><div className="theme-switch">
        <button className={palette==='cream'?'on':''} onClick={()=>setPalette('cream')}>☀ 白天</button>
        <button className={palette==='dusk'?'on':''} onClick={()=>setPalette('dusk')}>☾ 夜晚</button>
      </div></div>
      <div className="proto-tag">原型 v2 · 读说一体（语音为模拟交互）</div>
      <div className="device-shell">{children}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
