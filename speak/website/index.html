const AUTH_KEY = 'ybw.speak.experience.v2';
const LEGACY_AUTH_KEY = 'ybw.speak.auth.v1';
const DEMO_DURATION_MS = 20 * 60 * 1000;

// 旧版体验凭据可能包含手机号；页面启动时即幂等删除，不要求用户再次进入或退出体验。
try { localStorage.removeItem(LEGACY_AUTH_KEY); } catch (_) {}

const Auth = {
  read() {
    try {
      const raw = localStorage.getItem(AUTH_KEY);
      if (!raw) return null;
      const a = JSON.parse(raw);
      if (!a || a.provider !== 'demo' || !Number.isFinite(a.signedInAt)) return null;
      return {...a, nickname:typeof a.nickname === 'string' && a.nickname.trim() ? a.nickname.trim() : '体验学员'};
    } catch { return null; }
  },
  write(account) {
    localStorage.setItem(AUTH_KEY, JSON.stringify(account));
    window.dispatchEvent(new Event('ybw-auth-change'));
  },
  clear() {
    localStorage.removeItem(AUTH_KEY);
    localStorage.removeItem(LEGACY_AUTH_KEY);
    window.dispatchEvent(new Event('ybw-auth-change'));
  },
  signInDemo(nickname) {
    localStorage.removeItem(LEGACY_AUTH_KEY);
    const account = {
      experienceId: `demo-${Date.now()}`,
      signedInAt: Date.now(),
      nickname: (nickname || '').trim().slice(0, 16) || '体验学员',
      provider: 'demo',
    };
    Auth.write(account);
    return account;
  },
  isDemoExpired(account) {
    return account && account.provider === 'demo' &&
           (Date.now() - account.signedInAt) > DEMO_DURATION_MS;
  },
  demoRemainingSec(account) {
    if (!account || account.provider !== 'demo') return 0;
    return Math.max(0, Math.ceil((DEMO_DURATION_MS - (Date.now() - account.signedInAt)) / 1000));
  },
};

// React hook — re-renders when auth changes (this tab + other tabs).
function useAuth() {
  const [account, setAccount] = React.useState(() => Auth.read());
  React.useEffect(() => {
    const onChange = () => setAccount(Auth.read());
    window.addEventListener('ybw-auth-change', onChange);
    window.addEventListener('storage', onChange);
    return () => {
      window.removeEventListener('ybw-auth-change', onChange);
      window.removeEventListener('storage', onChange);
    };
  }, []);
  return account;
}

    if (ms > 0) setTimeout(() => setMsg(null), ms);

  const node = msg ? (
    <div style={{
      position:'fixed', left:'50%', top: 22, transform:'translateX(-50%)',
      background:'rgba(43,39,34,0.92)', color:'#fff',
      fontFamily: Tokens.font.zh, fontSize: 13, fontWeight: 500,

      boxShadow:'0 12px 40px rgba(0,0,0,0.25)', maxWidth: '88%',
      textAlign:'center', lineHeight: 1.5,
    }}>{msg}</div>
  ) : null;
  return { show, node };
}

// ═══════════════════════════════════════════════════════════════
// Scene data loader
// ═══════════════════════════════════════════════════════════════
//
// We ship the same scenes.json that the iOS app bundles, and the MP3
// clips (4 voices × 223 sentences) are served from ./audio/. Fetching
// keeps the web and iOS in lockstep — regenerating one source of truth
// propagates to both. The iOS JSON uses full-name fields; this
// transformer maps them to the short names the React screens expect.

// Rosie（外刊同款声线）为首选；有 rosie 片段的句子用 Rosie，没有的回落旧四声线（日常暂未重录不受影响）。
const VOICE_ORDER = ['rosie', 'bella', 'alice', 'chris', 'george'];

function transformScenesJSON(json) {
  const cats = (json.categories || []).map(c => ({ k: c.key, label: c.label }));

  // Each sentence transform — used for both tier sentences and the
  // legacy top-level sentences fallback.
  const xformSentence = (sen, tierLevel, sceneId) => {
    if (!sen.id) throw new Error(`句子缺少显式 id：${sceneId}/${tierLevel}`);
    return {
      id: sen.id,
      legacyIds: Array.isArray(sen.legacyIds) ? sen.legacyIds : [],
      tierLevel,
      en: sen.en,
      zh: sen.zh,
      words: sen.words || [],
      weak: sen.weak || [],
      audio: sen.audio || null, // {rosie,chris,...} → relative mp3 paths
      voice: sen.voice || null,  // 该句指定声线(男声对话轮=chris),缺省=rosie(女)
    };
  };

  // Build tiers. Every scene in the new schema has `tiers`; if a legacy
  // `sentences`-only scene sneaks through, we wrap it as a single 初级
  // tier so the rest of the UI only deals with one shape.
  const xformTiers = s => {
    if (Array.isArray(s.tiers) && s.tiers.length > 0) {
      return s.tiers.map(t => ({
        level: t.level,
        label: t.label,
        sents: t.sentenceCount ?? (t.sentences || []).length,
        sentences: (t.sentences || []).map(sen => xformSentence(sen, t.level, s.id)),
      }));
    }
    return [{
      level: 'beginner',
      label: '初级',
      sents: (s.sentences || []).length,
      sentences: (s.sentences || []).map(sen => xformSentence(sen, 'beginner', s.id)),
    }];
  };

  const scenes = (json.scenes || []).map(s => {
    const tiers = xformTiers(s);
    const beg = tiers.find(t => t.level === 'beginner') || tiers[0];
    return {
      id: s.id,
      // 'daily' = 日常对话跟读 (default); 'cambridge' = 剑桥考试对话.
      track: s.track || 'daily',
      // Only set on cambridge scenes: 'KET' | 'PET' | 'FCE'.
      exam: s.exam || null,
      // 剑桥备考三件套（仅 cambridge）：Part 标注 / 考点说明 / 答题模板锦囊。
      examPart: s.examPart || '',
      examTip: s.examTip || '',
      templates: Array.isArray(s.templates) ? s.templates : [],
      k: s.kind || s.category,
      cat: s.category || s.kind,
      title: s.title,
      sub: s.subtitle,
      level: s.level,
      mins: s.minutes,
      // Surface the 初级 tier's sentence count on the card so the
      // catalog feels consistent — power users go into the detail to
      // pick a higher tier.
      sents: beg.sents,
      progress: s.progress ?? 0,
      isNew: !!s.isNew,
      description: s.description || '',
      learn: s.learn || [],
      tiers,
      // Legacy `sentences` field — keep a flattened view of the 初级
      // tier for any code path we haven't migrated yet (practice/result
      // screens that want a default).
      sentences: beg.sentences,
    };
  });
  const examTopics = (json.examTopics || []).map(c => ({ k: c.key, label: c.label }));
  return { cats, scenes, examTopics };
}

// Prefer a voice that has a clip for this sentence; default to Bella (US♀).
function pickVoiceForSentence(sentence, preferred) {
  if (!sentence || !sentence.audio) return null;
  const order = preferred
    ? [preferred, ...VOICE_ORDER.filter(v => v !== preferred)]
    : VOICE_ORDER;
  for (const v of order) {
    if (sentence.audio[v]) return { voice: v, path: sentence.audio[v] };
  }
  return null;
}

// Play one sentence's MP3. slow=true uses playbackRate 0.75.
let _currentAudio = null;
function playSentenceAudio(sentence, { voice = 'bella', slow = false } = {}) {
  stopSentenceAudio();
  const pick = pickVoiceForSentence(sentence, voice);
  if (!pick) return null;
  const a = new Audio(`./audio/${pick.path}`);
  a.playbackRate = slow ? 0.75 : 1.0;
  _currentAudio = a;
  a.play().catch(() => {
    // autoplay policy、解码或网络失败时，通知调用方把播放按钮恢复为空闲态。
    if (_currentAudio !== a) return;
    _currentAudio = null;
    a.dispatchEvent(new Event('error'));
  });
  return a;
}
function stopSentenceAudio() {
  if (_currentAudio) {
    try {
      _currentAudio.onended = null;
      _currentAudio.onerror = null;
      _currentAudio.pause();
      _currentAudio.currentTime = 0;
    } catch (_) {}
    _currentAudio = null;
  }
}

function LoadingScreen() {
  return (
    <div style={{
      position:'fixed', inset: 0, display:'flex', alignItems:'center', justifyContent:'center',
      fontFamily:'-apple-system, system-ui, sans-serif', color:'#6E665A', fontSize: 13,
    }}>正在加载场景…</div>
  );
}

function LoadErrorScreen({ err }) {
  return (
    <div style={{
      position:'fixed', inset: 0, display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center', padding: 40, textAlign:'center',
      fontFamily:'-apple-system, system-ui, sans-serif', color:'#C55A30', fontSize: 13,
    }}>
      <div>场景数据加载失败 · 刷新重试</div>
      <div style={{fontSize: 10, color:'#6E665A', marginTop: 8}}>{String(err)}</div>
    </div>
  );
}

const _root = ReactDOM.createRoot(document.getElementById('root'));
_root.render(<LoadingScreen/>);

fetch('./scenes.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(`scenes.json ${r.status}`); return r.json(); })
  .then(json => {
    const { cats, scenes, examTopics } = transformScenesJSON(json);
    SCENE_CATS = cats;
    SCENES = scenes;
    EXAM_TOPICS = examTopics;
    _root.render(<AuthGate/>);
  })
  .catch(err => {
    console.error('[scenes] load failed', err);
    _root.render(<LoadErrorScreen err={err}/>);
  });
</script>
</body>
</html>
